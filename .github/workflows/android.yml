name: Build Android Debug APK
on:
  push:
    branches: [main]
    paths-ignore:
      - 'AGENTS.md'
      - 'README.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'AGENTS.md'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls /usr/local/lib/android/sdk/platforms || true
          ls /usr/local/lib/android/sdk/build-tools || true
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Sign APK with stable personal test key
        env:
          FI_DEBUG_SIGNING_KEYSTORE_B64: ${{ secrets.FI_DEBUG_SIGNING_KEYSTORE_B64 }}
          FI_DEBUG_SIGNING_PASSWORD: ${{ secrets.FI_DEBUG_SIGNING_PASSWORD }}
          FI_DEBUG_SIGNING_ALIAS: ${{ secrets.FI_DEBUG_SIGNING_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FI_DEBUG_SIGNING_KEYSTORE_B64" || -z "$FI_DEBUG_SIGNING_PASSWORD" || -z "$FI_DEBUG_SIGNING_ALIAS" ]]; then
            echo "Signing secrets unavailable; keeping the default debug signature (for example, on an untrusted fork PR)."
            exit 0
          fi
          key_file="$RUNNER_TEMP/football-intelligence-debug.p12"
          signed_apk="$RUNNER_TEMP/app-debug-signed.apk"
          printf '%s' "$FI_DEBUG_SIGNING_KEYSTORE_B64" | base64 --decode > "$key_file"
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          "$apksigner" sign \
            --ks "$key_file" \
            --ks-key-alias "$FI_DEBUG_SIGNING_ALIAS" \
            --ks-pass "env:FI_DEBUG_SIGNING_PASSWORD" \
            --key-pass "env:FI_DEBUG_SIGNING_PASSWORD" \
            --out "$signed_apk" \
            app/build/outputs/apk/debug/app-debug.apk
          "$apksigner" verify --verbose --print-certs "$signed_apk"
          mv "$signed_apk" app/build/outputs/apk/debug/app-debug.apk
          rm -f "$key_file"
      - uses: actions/upload-artifact@v7
        with:
          name: football-intelligence-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
